[project]
name = "masagent"
version = "0.1.0"
description = "MASAgent orchestrator — planner, agent swarm, PoC validation and reporting for AUTHORIZED penetration testing."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]  # used as an OpenRouter-compatible client; optional
dev = ["pytest>=8.0"]

[project.scripts]
masagent = "masagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["masagent*"]
